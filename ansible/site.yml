---
- name: Disable shell OSC context output
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Disable systemd OSC context shell profile
      ansible.builtin.raw: |
        for path in \
          /etc/profile.d/80-systemd-osc-context.sh \
          /usr/lib/systemd/profile.d/80-systemd-osc-context.sh; do
          if [ -e "$path" ]; then
            mv "$path" "$path.pulsaros-disabled"
          fi
        done
      changed_when: false

- name: Provision all testbed VMs
  hosts: all
  become: true
  roles:
    - common
    - kernel

- name: Provision VTEP dataplane prerequisites
  hosts: vteps
  become: true
  roles:
    - role: hugepages
      when: lookup('ansible.builtin.env', 'DATAPLANE') == 'pulsaros-dpdk'
    - role: dpdk
      when: lookup('ansible.builtin.env', 'DATAPLANE') == 'pulsaros-dpdk'

- name: Provision client traffic generator prerequisites
  hosts: clients
  become: true
  roles:
    - hugepages
    - traffic-tools

- name: Configure topology endpoints and selected VXLAN dataplane
  hosts: all
  become: true
  vars:
    vxlan_dataplane_mode: "{{ lookup('ansible.builtin.env', 'DATAPLANE') | default('linux-vxlan', true) }}"
  roles:
    - vxlan-test

- name: Deploy PulsarOS DPDK VXLAN dataplane
  hosts: vteps
  become: true
  vars:
    pulsaros_vxlan_runtime: service
  roles:
    - role: pulsaros-vxlan
      when: lookup('ansible.builtin.env', 'DATAPLANE') == 'pulsaros-dpdk'

- name: Configure FRR EVPN control plane
  hosts: vteps
  become: true
  roles:
    - role: frr-evpn
      when:
        - lookup('ansible.builtin.env', 'DATAPLANE') == 'linux-vxlan'
        - vxlan_control_plane_type == 'evpn'
