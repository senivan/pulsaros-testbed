---
- name: Validate PulsarOS VXLAN runtime mode
  ansible.builtin.assert:
    that:
      - (pulsaros_vxlan_runtime | default('smoke')) in ['smoke', 'service']
    fail_msg: "pulsaros_vxlan_runtime must be smoke or service"

- name: Install PulsarOS VXLAN build prerequisites
  ansible.builtin.shell: |
    set -euo pipefail
    dnf install -y \
      cmake \
      dpdk \
      dpdk-devel \
      gcc \
      git \
      libpcap-devel \
      make \
      numactl-devel \
      pciutils \
      pkgconf-pkg-config
  args:
    executable: /bin/bash
  changed_when: false

- name: Clone PulsarOS VXLAN repository
  ansible.builtin.shell: |
    set -euo pipefail
    prefix=/opt/pulsaros/vxlan
    source_dir="${prefix}/source"
    repo="${PULSAROS_VXLAN_REPO:-https://github.com/senivan/PulsarOS-vxlan.git}"
    ref="${PULSAROS_VXLAN_REF:-main}"

    mkdir -p "${prefix}"
    if [ ! -d "${source_dir}/.git" ]; then
      rm -rf "${source_dir}"
      git clone --recurse-submodules "${repo}" "${source_dir}"
    fi
    git -C "${source_dir}" fetch origin "${ref}"
    git -C "${source_dir}" checkout --force FETCH_HEAD
    git -C "${source_dir}" submodule update --init --recursive
  args:
    executable: /bin/bash
  environment:
    PULSAROS_VXLAN_REPO: "{{ pulsaros_vxlan_repo | default(lookup('ansible.builtin.env', 'PULSAROS_VXLAN_REPO') | default('https://github.com/senivan/PulsarOS-vxlan.git', true), true) }}"
    PULSAROS_VXLAN_REF: "{{ pulsaros_vxlan_ref | default(lookup('ansible.builtin.env', 'PULSAROS_VXLAN_REF') | default('main', true), true) }}"
  changed_when: true

- name: Build and install PulsarOS VXLAN dataplane
  ansible.builtin.shell: |
    set -euo pipefail
    source_dir=/opt/pulsaros/vxlan/source/dataplane
    build_dir="${source_dir}/build"

    cmake -S "${source_dir}" -B "${build_dir}" -DCMAKE_BUILD_TYPE=RelWithDebInfo
    cmake --build "${build_dir}" --target vxlan-dp
    install -D -m 0755 "${build_dir}/vxlan-dp" /usr/local/libexec/pulsaros/vxlan/vxlan-dp
    ln -sfn /usr/local/libexec/pulsaros/vxlan/vxlan-dp /usr/local/bin/pulsaros-vxlan-dp
  args:
    executable: /bin/bash
  changed_when: true

- name: Copy resolved topology to guest
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', playbook_dir + '/../artifacts/topology.json') }}"
    dest: /tmp/pulsaros-testbed-topology.json
    mode: "0644"

- name: Bind PulsarOS VXLAN dataplane PCI functions to UIO
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json
    import os
    import subprocess
    from pathlib import Path

    host_name = os.environ["TOPOLOGY_HOST"]
    topology = json.loads(Path("/tmp/pulsaros-testbed-topology.json").read_text())
    host = topology["hosts"][host_name]
    management_macs = {
        nic["mac"].lower() for nic in host["nics"] if nic.get("management")
    }

    targets = {}
    for segment in topology.get("segments", {}).values():
        local = next(
            (vtep for vtep in segment.get("vteps", []) if vtep["host"] == host_name),
            None,
        )
        if not local:
            continue
        targets.setdefault(
            local["underlay_mac"].lower(),
            {"name": f"underlay-{local['underlay_nic']}", "role": "underlay"},
        )
        for nic in local.get("local_nics", []):
            targets.setdefault(
                nic["mac"].lower(),
                {"name": f"access-{nic['name']}", "role": "access"},
            )

    if not targets:
        raise SystemExit(f"no dataplane PCI targets found for {host_name}")
    if management_macs & set(targets):
        raise SystemExit("management NIC was selected as a DPDK dataplane target")

    def iface_by_mac(mac):
        for path in Path("/sys/class/net").iterdir():
            try:
                if (path / "address").read_text().strip().lower() == mac:
                    return path
            except FileNotFoundError:
                continue
        return None

    def pci_parent(iface):
        device = (iface / "device").resolve()
        for candidate in (device, *device.parents):
            if (Path("/sys/bus/pci/devices") / candidate.name).exists():
                return candidate.name
        raise SystemExit(f"{iface.name} has no PCI parent")

    existing_path = Path("/etc/pulsaros/vxlan/pci-map.json")
    if existing_path.exists():
        existing = {
            port["mac"].lower(): port
            for port in json.loads(existing_path.read_text()).get("ports", [])
        }
    else:
        existing = {}

    mappings = []
    for mac, target in targets.items():
        iface = iface_by_mac(mac)
        if iface is None:
            saved = existing.get(mac)
            if not saved:
                raise SystemExit(f"kernel netdev or saved PCI mapping for {mac} was not found")
            bdf = saved["pci"]
            iface_name = saved["iface"]
            kernel_bound = False
        else:
            bdf = pci_parent(iface)
            iface_name = iface.name
            kernel_bound = True
        if not (Path("/sys/bus/pci/devices") / bdf).exists():
            raise SystemExit(f"dataplane port does not resolve to a PCI function: {bdf}")
        mappings.append({
            **target, "mac": mac, "iface": iface_name, "pci": bdf,
            "kernel_bound": kernel_bound,
        })

    subprocess.run(["modprobe", "uio_pci_generic"], check=True)
    for mapping in mappings:
        iface = mapping["iface"]
        bdf = mapping["pci"]
        if mapping["kernel_bound"]:
            subprocess.run(["ip", "link", "set", iface, "nomaster"], check=False)
            subprocess.run(["ip", "addr", "flush", "dev", iface], check=True)
            subprocess.run(["ip", "link", "set", iface, "down"], check=True)
        device = Path("/sys/bus/pci/devices") / bdf
        driver_link = device / "driver"
        current = driver_link.resolve().name if driver_link.exists() else None
        if current != "uio_pci_generic":
            (device / "driver_override").write_text("uio_pci_generic\n")
            if driver_link.exists():
                (driver_link.resolve() / "unbind").write_text(f"{bdf}\n")
            Path("/sys/bus/pci/drivers_probe").write_text(f"{bdf}\n")
        current = driver_link.resolve().name if driver_link.exists() else None
        if current != "uio_pci_generic":
            raise SystemExit(f"failed to bind {bdf} ({mapping['name']}) to uio_pci_generic")

    output = Path("/etc/pulsaros/vxlan/pci-map.json")
    output.parent.mkdir(parents=True, exist_ok=True)
    persisted = [
        {key: value for key, value in mapping.items() if key != "kernel_bound"}
        for mapping in mappings
    ]
    output.write_text(json.dumps({"ports": persisted}, indent=2, sort_keys=True) + "\n")
    PY
  args:
    executable: /bin/bash
  environment:
    TOPOLOGY_HOST: "{{ inventory_hostname }}"
  changed_when: true
  when: (pulsaros_vxlan_runtime | default('smoke')) == 'service'

- name: Render PulsarOS VXLAN per-host config
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PY'
    import json
    import os
    from pathlib import Path

    host_name = os.environ["TOPOLOGY_HOST"]
    topology = json.loads(Path("/tmp/pulsaros-testbed-topology.json").read_text())
    segments = topology.get("segments", {})

    pci_map = json.loads(Path("/etc/pulsaros/vxlan/pci-map.json").read_text())
    pci_by_mac = {port["mac"].lower(): port["pci"] for port in pci_map["ports"]}

    ports = []
    vxlan_segments = []
    port_names = set()

    def add_port(port):
        name = port["name"]
        if name in port_names:
            return
        port_names.add(name)
        ports.append(port)

    for segment_name, segment in segments.items():
        local = None
        peers = []
        for vtep in segment.get("vteps", []):
            if vtep["host"] == host_name:
                local = vtep
            else:
                peers.append(vtep)
        if not local:
            continue

        underlay_pci = pci_by_mac.get(local["underlay_mac"].lower())
        if not underlay_pci:
            raise SystemExit(f"missing PCI mapping for {local['underlay_mac']}")
        underlay_port = f"underlay-{local['underlay_nic']}"
        add_port(
            {
                "name": underlay_port,
                "role": "underlay",
                "pmd": "phys",
                "pci": underlay_pci,
                "ip": local["underlay_ip"],
            }
        )

        access_ports = []
        for nic in local.get("local_nics", []):
            pci = pci_by_mac.get(nic["mac"].lower())
            if not pci:
                raise SystemExit(f"missing PCI mapping for {nic['mac']}")
            access_port = f"access-{nic['name']}"
            add_port(
                {
                    "name": access_port,
                    "role": "access",
                    "pmd": "phys",
                    "pci": pci,
                }
            )
            access_ports.append(access_port)

        if not access_ports:
            continue
        vxlan_segments.append(
            {
                "name": segment_name,
                "vni": segment["vni"],
                "underlay_port": underlay_port,
                "access_ports": access_ports,
                "peers": [{"ip": peer["underlay_address"]} for peer in peers],
            }
        )

    config = {
        "schema_version": 1,
        "dataplane": {
            "lcores": os.environ.get("PULSAROS_VXLAN_LCORES", "0-1"),
            "mbufs": int(os.environ.get("PULSAROS_VXLAN_MBUFS", "8192")),
            "mbuf_cache": int(os.environ.get("PULSAROS_VXLAN_MBUF_CACHE", "256")),
            "rx_desc": int(os.environ.get("PULSAROS_VXLAN_RX_DESC", "1024")),
            "tx_desc": int(os.environ.get("PULSAROS_VXLAN_TX_DESC", "1024")),
        },
        "ports": ports,
        "vxlan": {
            "udp_port": 4789,
            "controlplane": "static",
            "segments": vxlan_segments,
        },
    }

    if not ports or not vxlan_segments:
        raise SystemExit(f"no PulsarOS VXLAN config rendered for VTEP {host_name}")

    Path("/etc/pulsaros/vxlan").mkdir(parents=True, exist_ok=True)
    Path("/tmp/pulsaros-testbed").mkdir(parents=True, exist_ok=True)
    rendered = json.dumps(config, indent=2, sort_keys=True) + "\n"
    Path("/etc/pulsaros/vxlan/config.json").write_text(rendered, encoding="utf-8")
    Path("/tmp/pulsaros-testbed/pulsaros-vxlan-config.json").write_text(
        rendered,
        encoding="utf-8",
    )
    PY
  args:
    executable: /bin/bash
  environment:
    TOPOLOGY_HOST: "{{ inventory_hostname }}"
    PULSAROS_VXLAN_LCORES: "{{ lookup('ansible.builtin.env', 'PULSAROS_VXLAN_LCORES') | default('0-1', true) }}"
    PULSAROS_VXLAN_MBUFS: "{{ lookup('ansible.builtin.env', 'PULSAROS_VXLAN_MBUFS') | default('8192', true) }}"
    PULSAROS_VXLAN_MBUF_CACHE: "{{ lookup('ansible.builtin.env', 'PULSAROS_VXLAN_MBUF_CACHE') | default('256', true) }}"
    PULSAROS_VXLAN_RX_DESC: "{{ lookup('ansible.builtin.env', 'PULSAROS_VXLAN_RX_DESC') | default('1024', true) }}"
    PULSAROS_VXLAN_TX_DESC: "{{ lookup('ansible.builtin.env', 'PULSAROS_VXLAN_TX_DESC') | default('1024', true) }}"
  changed_when: true

- name: Run PulsarOS VXLAN init smoke
  ansible.builtin.shell: |
    set -euo pipefail
    mkdir -p /tmp/pulsaros-testbed
    log=/tmp/pulsaros-testbed/pulsaros-vxlan-init.log
    timeout 20 pulsaros-vxlan-dp /etc/pulsaros/vxlan/config.json > "${log}" 2>&1
    cat "${log}"
    grep -q 'initialized .* DPDK ports' "${log}"
  args:
    executable: /bin/bash
  changed_when: true
  when: (pulsaros_vxlan_runtime | default('smoke')) == 'smoke'

- name: Install PulsarOS VXLAN systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/pulsaros-vxlan.service
    mode: "0644"
    content: |
      [Unit]
      Description=PulsarOS DPDK VXLAN dataplane
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/stdbuf -oL -eL /usr/local/bin/pulsaros-vxlan-dp /etc/pulsaros/vxlan/config.json
      Restart=on-failure
      RestartSec=2
      LimitMEMLOCK=infinity

      [Install]
      WantedBy=multi-user.target
  when: (pulsaros_vxlan_runtime | default('smoke')) == 'service'

- name: Start PulsarOS VXLAN dataplane service
  ansible.builtin.systemd:
    name: pulsaros-vxlan
    daemon_reload: true
    enabled: true
    state: restarted
  when: (pulsaros_vxlan_runtime | default('smoke')) == 'service'

- name: Verify PulsarOS VXLAN dataplane initialization
  ansible.builtin.shell: |
    set -euo pipefail
    systemctl is-active --quiet pulsaros-vxlan
    journalctl -b -u pulsaros-vxlan --no-pager | grep -q 'initialized .* DPDK ports; entering forwarding loop'
  args:
    executable: /bin/bash
  changed_when: false
  when: (pulsaros_vxlan_runtime | default('smoke')) == 'service'
  retries: 10
  delay: 1
  register: pulsaros_vxlan_service_ready
  until: pulsaros_vxlan_service_ready.rc == 0
