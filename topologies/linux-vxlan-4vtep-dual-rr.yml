schema_version: 1
name: linux-vxlan-4vtep-dual-rr
description: Four-VTEP single-segment VXLAN EVPN topology with two FRR route reflectors.

networks:
  underlay:
    mode: access
    vnet_prefix: ru
    inner_vlan: 302
    legacy_vlan_offset: 52
  edge-a:
    mode: access
    vnet_prefix: da
    inner_vlan: 311
    legacy_vlan_offset: 53
  edge-b:
    mode: access
    vnet_prefix: db
    inner_vlan: 312
    legacy_vlan_offset: 54
  edge-c:
    mode: access
    vnet_prefix: dc
    inner_vlan: 313
    legacy_vlan_offset: 55
  edge-d:
    mode: access
    vnet_prefix: dd
    inner_vlan: 314
    legacy_vlan_offset: 56

hosts:
  vtep-a:
    vmid_offset: 1
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 1
        management: true
      - name: underlay
        network: underlay
        mac_offset: 21
      - name: edge
        network: edge-a
        mac_offset: 31

  vtep-b:
    vmid_offset: 2
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 2
        management: true
      - name: underlay
        network: underlay
        mac_offset: 22
      - name: edge
        network: edge-b
        mac_offset: 32

  vtep-c:
    vmid_offset: 3
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 3
        management: true
      - name: underlay
        network: underlay
        mac_offset: 23
      - name: edge
        network: edge-c
        mac_offset: 33

  vtep-d:
    vmid_offset: 4
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 4
        management: true
      - name: underlay
        network: underlay
        mac_offset: 24
      - name: edge
        network: edge-d
        mac_offset: 34

  client-a:
    vmid_offset: 11
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 101
        management: true
      - name: data
        network: edge-a
        mac_offset: 111

  client-b:
    vmid_offset: 12
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 102
        management: true
      - name: data
        network: edge-b
        mac_offset: 112

  client-c:
    vmid_offset: 13
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 103
        management: true
      - name: data
        network: edge-c
        mac_offset: 113

  client-d:
    vmid_offset: 14
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 104
        management: true
      - name: data
        network: edge-d
        mac_offset: 114

segments:
  tenant-a:
    vni: 10500
    vteps:
      - host: vtep-a
        underlay_nic: underlay
        underlay_ip: 172.16.105.1/24
        local_nics:
          - edge
      - host: vtep-b
        underlay_nic: underlay
        underlay_ip: 172.16.105.2/24
        local_nics:
          - edge
      - host: vtep-c
        underlay_nic: underlay
        underlay_ip: 172.16.105.3/24
        local_nics:
          - edge
      - host: vtep-d
        underlay_nic: underlay
        underlay_ip: 172.16.105.4/24
        local_nics:
          - edge
    members:
      - host: client-a
        nic: data
        mode: access
        ip: 10.10.50.11/24
      - host: client-b
        nic: data
        mode: access
        ip: 10.10.50.12/24
      - host: client-c
        nic: data
        mode: access
        ip: 10.10.50.13/24
      - host: client-d
        nic: data
        mode: access
        ip: 10.10.50.14/24

control_plane:
  type: evpn
  asn: 65050
  peering: route_reflector
  route_reflectors:
    - vtep-a
    - vtep-b

plays:
  - name: Disable shell OSC context output
    hosts: all
    become: true
    gather_facts: false
    tasks:
      - name: Disable systemd OSC context shell profile
        ansible.builtin.raw: |
          for path in \
            /etc/profile.d/80-systemd-osc-context.sh \
            /usr/lib/systemd/profile.d/80-systemd-osc-context.sh; do
            if [ -e "$path" ]; then
              mv "$path" "$path.pulsaros-disabled"
            fi
          done
        changed_when: false
  - name: Provision all testbed VMs
    hosts: all
    become: true
    roles:
      - common
      - kernel
  - name: Provision VTEP dataplane prerequisites
    hosts: vteps
    become: true
    roles:
      - hugepages
      - dpdk
      - pulsaros-vxlan
  - name: Configure 4-VTEP VXLAN EVPN route reflector topology
    hosts: all
    become: true
    roles:
      - vxlan-test
  - name: Configure FRR EVPN control plane
    hosts: vteps
    become: true
    roles:
      - frr-evpn

checks:
  - name: evpn-control-plane
    type: evpn_control_plane
    timeout: 60

  - name: tenant-a-ping-matrix
    type: segment_ping_matrix
    segment: tenant-a
    count: 3
    wait: 2
    timeout: 45

  - name: tenant-a-vxlan-underlay-capture
    type: segment_bidirectional_capture
    segment: tenant-a
    count: 3
    wait: 2
    timeout: 45
    captures:
      - host: vtep-a
        nic: underlay
        filter: udp port 4789
      - host: vtep-b
        nic: underlay
        filter: udp port 4789
      - host: vtep-c
        nic: underlay
        filter: udp port 4789
      - host: vtep-d
        nic: underlay
        filter: udp port 4789
    assertions:
      min_packets: 3
      contains:
        - VXLAN

  - name: tenant-a-perf-probe
    type: segment_perf_probe
    segment: tenant-a
    count: 10
    wait: 2
    timeout: 45
    pairs:
      - source: client-a.data
        destination: client-b.data
      - source: client-a.data
        destination: client-c.data
      - source: client-a.data
        destination: client-d.data
    thresholds:
      max_loss_percent: 0
      max_rtt_avg_ms: 10

faults:
  - name: tenant-a-frr-restart-client-c
    type: frr_restart
    segment: tenant-a
    expected_impact: no_outage
    settle: 5
    recover_timeout: 45
    pairs:
      - source: client-a.data
        destination: client-c.data
