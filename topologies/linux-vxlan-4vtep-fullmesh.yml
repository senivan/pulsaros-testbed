schema_version: 1
name: linux-vxlan-4vtep-fullmesh
description: Four-VTEP single-segment VXLAN EVPN topology with full-mesh FRR peering.

networks:
  underlay:
    mode: access
    vnet_prefix: fu
    inner_vlan: 202
    legacy_vlan_offset: 42
  edge-a:
    mode: access
    vnet_prefix: fa
    inner_vlan: 211
    legacy_vlan_offset: 43
  edge-b:
    mode: access
    vnet_prefix: fb
    inner_vlan: 212
    legacy_vlan_offset: 44
  edge-c:
    mode: access
    vnet_prefix: fc
    inner_vlan: 213
    legacy_vlan_offset: 45
  edge-d:
    mode: access
    vnet_prefix: fd
    inner_vlan: 214
    legacy_vlan_offset: 46

hosts:
  vtep-a:
    vmid_offset: 1
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 1
        management: true
      - name: underlay
        network: underlay
        mac_offset: 21
      - name: edge
        network: edge-a
        mac_offset: 31

  vtep-b:
    vmid_offset: 2
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 2
        management: true
      - name: underlay
        network: underlay
        mac_offset: 22
      - name: edge
        network: edge-b
        mac_offset: 32

  vtep-c:
    vmid_offset: 3
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 3
        management: true
      - name: underlay
        network: underlay
        mac_offset: 23
      - name: edge
        network: edge-c
        mac_offset: 33

  vtep-d:
    vmid_offset: 4
    groups:
      - vteps
    nics:
      - name: mgmt
        network: management
        mac_offset: 4
        management: true
      - name: underlay
        network: underlay
        mac_offset: 24
      - name: edge
        network: edge-d
        mac_offset: 34

  client-a:
    vmid_offset: 11
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 101
        management: true
      - name: data
        network: edge-a
        mac_offset: 111

  client-b:
    vmid_offset: 12
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 102
        management: true
      - name: data
        network: edge-b
        mac_offset: 112

  client-c:
    vmid_offset: 13
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 103
        management: true
      - name: data
        network: edge-c
        mac_offset: 113

  client-d:
    vmid_offset: 14
    groups:
      - clients
    nics:
      - name: mgmt
        network: management
        mac_offset: 104
        management: true
      - name: data
        network: edge-d
        mac_offset: 114

segments:
  tenant-a:
    vni: 10400
    vteps:
      - host: vtep-a
        underlay_nic: underlay
        underlay_ip: 172.16.104.1/24
        local_nics:
          - edge
      - host: vtep-b
        underlay_nic: underlay
        underlay_ip: 172.16.104.2/24
        local_nics:
          - edge
      - host: vtep-c
        underlay_nic: underlay
        underlay_ip: 172.16.104.3/24
        local_nics:
          - edge
      - host: vtep-d
        underlay_nic: underlay
        underlay_ip: 172.16.104.4/24
        local_nics:
          - edge
    members:
      - host: client-a
        nic: data
        mode: access
        ip: 10.10.40.11/24
      - host: client-b
        nic: data
        mode: access
        ip: 10.10.40.12/24
      - host: client-c
        nic: data
        mode: access
        ip: 10.10.40.13/24
      - host: client-d
        nic: data
        mode: access
        ip: 10.10.40.14/24

control_plane:
  type: evpn
  asn: 65040
  peering: full_mesh

plays:
  - name: Disable shell OSC context output
    hosts: all
    become: true
    gather_facts: false
    tasks:
      - name: Disable systemd OSC context shell profile
        ansible.builtin.raw: |
          for path in \
            /etc/profile.d/80-systemd-osc-context.sh \
            /usr/lib/systemd/profile.d/80-systemd-osc-context.sh; do
            if [ -e "$path" ]; then
              mv "$path" "$path.pulsaros-disabled"
            fi
          done
        changed_when: false
  - name: Provision all testbed VMs
    hosts: all
    become: true
    roles:
      - common
      - kernel
  - name: Provision VTEP dataplane prerequisites
    hosts: vteps
    become: true
    roles:
      - hugepages
      - dpdk
      - pulsaros-vxlan
  - name: Configure 4-VTEP VXLAN EVPN full mesh
    hosts: all
    become: true
    roles:
      - vxlan-test
  - name: Configure FRR EVPN control plane
    hosts: vteps
    become: true
    roles:
      - frr-evpn

checks:
  - name: evpn-control-plane
    type: evpn_control_plane
    timeout: 60

  - name: tenant-a-ping-matrix
    type: segment_ping_matrix
    segment: tenant-a
    count: 3
    wait: 2
    timeout: 45

  - name: tenant-a-vxlan-underlay-capture
    type: segment_bidirectional_capture
    segment: tenant-a
    count: 3
    wait: 2
    timeout: 45
    captures:
      - host: vtep-a
        nic: underlay
        filter: udp port 4789
      - host: vtep-b
        nic: underlay
        filter: udp port 4789
      - host: vtep-c
        nic: underlay
        filter: udp port 4789
      - host: vtep-d
        nic: underlay
        filter: udp port 4789
    assertions:
      min_packets: 3
      contains:
        - VXLAN

  - name: tenant-a-perf-probe
    type: segment_perf_probe
    segment: tenant-a
    count: 10
    wait: 2
    timeout: 45
    pairs:
      - source: client-a.data
        destination: client-b.data
      - source: client-a.data
        destination: client-c.data
      - source: client-a.data
        destination: client-d.data
    thresholds:
      max_loss_percent: 0
      max_rtt_avg_ms: 10

faults:
  - name: tenant-a-bgp-peer-shutdown-a-to-d
    type: bgp_peer_shutdown
    segment: tenant-a
    settle: 5
    recover_timeout: 45
    pairs:
      - source: client-a.data
        destination: client-d.data
